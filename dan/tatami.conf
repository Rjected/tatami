# tatami config for Dan: your i3 setup (rjected/nix-configs nixpkgs/i3.nix), ported to
# macOS and put in nvim's movement language, which pyr (~/.config/pyramid-tui/pyrrc) shares.
#
# Mod: option, as in your AeroSpace config. Cmd stays with apps (cmd-h, cmd-q, cmd-space).
#
#                 nvim             pyr                tatami
#   focus         C-hjkl           C-hjkl             opt-hjkl
#   move          C-w HJKL         ,wh / ,wl (swap)   opt-shift-hjkl
#   split  - / |  ,h / ,v          ,h / ,v            opt-, h / v
#   resize        ,k ,j ,l         ,k ,j ,l           opt-, k j l   (opt-r: resize mode)
#   prev / next   S-h / S-l        S-h / S-l          opt-, H / L   (or ctrl-opt-h / l)
#   close         ,c               ,c                 opt-, c       (or opt-shift-q)
#   last          (buffer #)       -                  opt-tab
#
# opt-, is tatami's leader, standing in for nvim's ',' leader: press it, then one key.
# Kept free for nvim: opt-n, opt-i, opt-o, opt-c (your DAP step keys).

gap inner 0
gap outer 0
gap toggle 10

# i3: border 1, no titlebar, focused child border #004f00.
border width 2
border radius 12
border color 004f00

# Focus (nvim C-hjkl, i3 Mod+hjkl)
bind alt-h : focus west
bind alt-j : focus south
bind alt-k : focus north
bind alt-l : focus east

# Move the window (nvim C-w HJKL, i3 Mod+Shift+hjkl)
bind alt-shift-h : warp west
bind alt-shift-j : warp south
bind alt-shift-k : warp north
bind alt-shift-l : warp east

# Leader (nvim ','): opt-comma, then one key. Esc backs out.
bind alt-comma : mode leader
bind mode:leader h : insert south ; mode main
bind mode:leader v : insert east ; mode main
bind mode:leader k : resize height 40 ; mode main
bind mode:leader j : resize height -40 ; mode main
bind mode:leader l : resize width 40 ; mode main
bind mode:leader shift-h : workspace prev ; mode main
bind mode:leader shift-l : workspace next ; mode main
bind mode:leader c : close ; mode main
bind mode:leader b : balance ; mode main
bind mode:leader f : toggle float ; mode main
bind mode:leader r : retile ; mode main
bind mode:leader esc : mode main
bind mode:leader alt-comma : mode main

# Resize mode, for repeated steps (i3 Mod+r), same sense as nvim ,hjkl:
# l wider, h narrower, k taller, j shorter. esc or enter leaves.
bind alt-r : mode resize
bind mode:resize h : resize width -40
bind mode:resize l : resize width 40
bind mode:resize k : resize height 40
bind mode:resize j : resize height -40
bind mode:resize b : balance
bind mode:resize esc : mode main
bind mode:resize return : mode main

# Layouts (i3 Mod+e split toggle; Mod+s / Mod+w stacked and tabbed become accordion)
bind alt-e : toggle split
bind alt-s : toggle accordion
bind alt-w : toggle accordion

# Fullscreen and floating (i3 Mod+f, Mod+Shift+space)
bind alt-f : toggle zoom-fullscreen
bind alt-shift-space : toggle float

# Workspaces (i3 Mod+N, Mod+Shift+N)
bind alt-1 : workspace 1
bind alt-2 : workspace 2
bind alt-3 : workspace 3
bind alt-4 : workspace 4
bind alt-5 : workspace 5
bind alt-6 : workspace 6
bind alt-7 : workspace 7
bind alt-8 : workspace 8
bind alt-9 : workspace 9
bind alt-0 : workspace 10
bind alt-shift-1 : send 1
bind alt-shift-2 : send 2
bind alt-shift-3 : send 3
bind alt-shift-4 : send 4
bind alt-shift-5 : send 5
bind alt-shift-6 : send 6
bind alt-shift-7 : send 7
bind alt-shift-8 : send 8
bind alt-shift-9 : send 9
bind alt-shift-0 : send 10

# Previous / next workspace without the leader (i3 Mod+Alt+h/l)
bind ctrl-alt-h : workspace prev
bind ctrl-alt-l : workspace next
bind ctrl-alt-shift-h : send prev --follow
bind ctrl-alt-shift-l : send next --follow
# Last workspace (tmux prefix Tab)
bind alt-tab : workspace recent

# Monitors
bind alt-shift-tab : send-monitor next --follow

# Programs, close, reload, exit (i3 Mod+Return, Mod+Shift+q, Mod+Shift+c, Mod+Shift+e).
# Launcher stays Raycast's cmd-space (i3 Mod+space was rofi).
bind alt-return : exec /usr/bin/open -na /Applications/Ghostty.app
bind alt-shift-q : close
bind alt-shift-c : reload
bind alt-shift-e : quit

# Service mode, as in your AeroSpace config: opt-shift-; then one key.
bind alt-shift-semicolon : mode service
bind mode:service esc : mode main
bind mode:service r : retile ; mode main
bind mode:service f : toggle float ; mode main
bind mode:service backspace : close-others ; mode main

# Windows that float
rule app="System Settings" : float
rule app="System Information" : float
rule app="Archive Utility" : float
rule app="Installer" : float
rule app="Activity Monitor" : float
rule app="Calculator" : float
rule app="Finder" : float
rule app="Raycast" : float
rule app="1Password" : float
rule app="QuickTime Player" : float
rule app="Digital Color Meter" : float
rule bundle="com.tinyspeck.slackmacgap" title="Huddle" : float
